<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Checkout</h1>
        <div class="checkout-form">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" pattern="[0-9]{10}">
            </div>
            <div class="form-group">
                <label for="products">Product IDs</label>
                <textarea id="products" placeholder="Enter product IDs (one per line)"></textarea>
            </div>
            <button onclick="proceedToPayment()" class="primary-btn">Proceed to Payment</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
