<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Shopping Cart</h1>
        
        <div class="cart-section">
            <div class="user-details">
                <h2>Customer Details</h2>
                <div id="customer-info"></div>
            </div>

            <div class="delivery-address">
                <h2>Delivery Address</h2>
                <div id="address-info"></div>
            </div>

            <div class="product-list">
                <h2>Products</h2>
                <div id="products-container"></div>
            </div>

            <div class="charges-summary">
                <h2>Charges Summary</h2>
                <div id="charges-breakdown">
                    <div class="charge-row">
                        <span>Products Total:</span>
                        <span id="products-total">INR 0.00</span>
                    </div>
                    <div class="charge-row">
                        <span>Delivery Charge:</span>
                        <span id="delivery-charge">INR 0.00</span>
                    </div>
                    <div class="charge-row">
                        <span>Installation Charge:</span>
                        <span id="installation-charge">INR 0.00</span>
                    </div>
                    <div class="charge-row total">
                        <span>Total Amount:</span>
                        <span id="total-amount">INR 0.00</span>
                    </div>
                </div>
            </div>

            <button onclick="proceedToPayment()" class="primary-btn">Continue</button>
        </div>
    </div>
    <script src="cart.js"></script>
</body>
</html>
