<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Complete Payment</h1>
        <div class="payment-section">
            <div id="qrcode"></div>
            <p>Scan QR code or click the link below to proceed</p>
            <a href="#" id="paymentLink" class="skip-btn">Click here to proceed</a>
            <button onclick="skipPayment()" class="payment-link">Skip Payment</button>
        </div>
    </div>
    <script src="qr.js"></script>
</body>
</html>
